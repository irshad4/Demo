<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #333;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        
        #gameContainer {
            text-align: center;
        }
        
        canvas {
            border: 2px solid #fff;
            background-color: #111;
            display: block;
            margin: 20px auto;
        }
        
        h1 {
            color: #fff;
            margin: 0 0 20px 0;
        }
        
        #score {
            color: #fff;
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        #gameOver {
            color: #ff4444;
            font-size: 16px;
            display: none;
            margin-top: 10px;
        }
        
        .instructions {
            color: #aaa;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>Snake Game</h1>
        <div id="score">Score: 0</div>
        <canvas id="snakeCanvas" width="400" height="400"></canvas>
        <div id="gameOver">Game Over! Press F5 to restart</div>
        <div class="instructions">
            Use Arrow Keys to move | Eat red food to grow
        </div>
    </div>

    <script>
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const gameOverDisplay = document.getElementById('gameOver');
        
        const box = 20;
        let snake = [{ x: 9 * box, y: 9 * box }];
        let direction = 'RIGHT';
        let nextDirection = 'RIGHT';
        let food = { x: Math.floor(Math.random() * 20) * box, y: Math.floor(Math.random() * 20) * box };
        let gameRunning = true;

        document.addEventListener('keydown', function(event) {
            switch(event.keyCode) {
                case 37:
                    if (direction !== 'RIGHT') nextDirection = 'LEFT';
                    break;
                case 38:
                    if (direction !== 'DOWN') nextDirection = 'UP';
                    break;
                case 39:
                    if (direction !== 'LEFT') nextDirection = 'RIGHT';
                    break;
                case 40:
                    if (direction !== 'UP') nextDirection = 'DOWN';
                    break;
            }
        });

        function placeFood() {
            food = {
                x: Math.floor(Math.random() * 20) * box,
                y: Math.floor(Math.random() * 20) * box
            };
        }

        function checkCollision(head) {
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return true;
            }
            
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            
            return false;
        }

        function update() {
            direction = nextDirection;
            
            let head = {
                x: snake[0].x,
                y: snake[0].y
            };

            if (direction === 'LEFT') head.x -= box;
            if (direction === 'UP') head.y -= box;
            if (direction === 'RIGHT') head.x += box;
            if (direction === 'DOWN') head.y += box;

            if (checkCollision(head)) {
                gameRunning = false;
                gameOverDisplay.style.display = 'block';
                clearInterval(gameLoop);
                return;
            }

            if (head.x === food.x && head.y === food.y) {
                placeFood();
            } else {
                snake.pop();
            }

            snake.unshift(head);
            scoreDisplay.textContent = 'Score: ' + (snake.length - 1);
        }

        function draw() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#222';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= canvas.width; i += box) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            ctx.fillStyle = '#ff4444';
            ctx.fillRect(food.x, food.y, box - 2, box - 2);

            for (let i = 0; i < snake.length; i++) {
                ctx.fillStyle = (i === 0) ? '#00ff00' : '#ffffff';
                ctx.fillRect(snake[i].x + 1, snake[i].y + 1, box - 2, box - 2);
            }
        }

        function gameLoopFunc() {
            update();
            draw();
        }

        const gameLoop = setInterval(gameLoopFunc, 100);
    </script>
</body>
</html>
